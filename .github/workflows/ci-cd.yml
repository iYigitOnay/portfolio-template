name: CI/CD

# main'e her push: kontrol → başarılıysa canlıya deploy.
# Pull request'ler: kontrol → başarılıysa önizleme deploy'u (adresi PR'a yorum olarak yazılır).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  VERCEL_CLI: "vercel@65.14.0"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    name: Lint, tip kontrolü, build
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          SITE_URL: https://example.com

  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Önizleme deploy' || 'Canlı deploy' }}
    needs: check
    # Fork'tan gelen PR'larda secret'lar yoktur; orada deploy denenmez.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      # Canlı deploy'lar sırayla çalışır, yarıda kesilmez.
      group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Vercel secret'larını kontrol et
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Eksik repo secret'ları:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global ${{ env.VERCEL_CLI }}

      - name: Vercel ayarlarını ve ortam değişkenlerini çek
        run: vercel pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deploy hazır: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Önizleme adresini PR'a yaz
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --edit-last --create-if-none \
            --body "Önizleme: ${{ steps.deploy.outputs.url }} (${{ github.event.pull_request.head.sha }})"
